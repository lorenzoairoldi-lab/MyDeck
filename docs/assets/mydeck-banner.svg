    <text x="184" y="160" fill="#9cadc4" font-size="22">Il tuo Linux. A colpo d’occhio.</text>
    <text x="51" y="235" fill="#8195b1" font-size="12" font-weight="600" letter-spacing="3">TERMINAL  /  LIVE METRICS  /  OPEN SOURCE</text>
