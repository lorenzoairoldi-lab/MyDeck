      <stop offset="1" stop-color="#344ba4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8dadd0" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
