<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">MyDeck — Il tuo Linux. A colpo d’occhio.</title>
  <desc id="description">Banner MyDeck con un monitor stilizzato, una curva ciano e accenti viola, verdi e ambra su fondo blu notte.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
